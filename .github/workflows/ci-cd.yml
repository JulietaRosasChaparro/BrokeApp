name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt

    - name: Test with pytest
      run: python -m pytest app/ -v
        
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.tag }}

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Login to GitHub Container Registry
      if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,prefix=
          type=ref,event=branch

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}

    - name: Save image tag
      id: image
      run: echo "tag=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> $GITHUB_OUTPUT

  validate:
    name: Validate
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: read

    steps:
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Pull image
      run: docker pull ${{ needs.build.outputs.image }}

    - name: Start container
      run: docker run -d -p 5000:5000 --name app ${{ needs.build.outputs.image }}

    - name: Wait for app to be ready
      run: |
        for i in $(seq 1 10); do
          if curl -fsS --max-time 2 http://localhost:5000/health >/dev/null; then
            exit 0
          fi
          echo "Attempt $i failed, retrying..."
          sleep 2
        done
        echo "Application did not become ready" >&2
        exit 1

    - name: Validate /health endpoint
      run: |
        response=$(curl -fsS --max-time 5 http://localhost:5000/health)
        echo "$response" | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"status": "OK"}'

    - name: Validate / endpoint
      run: |
        response=$(curl -fsS --max-time 5 http://localhost:5000/)
        echo "$response" | python3 -c 'import json, sys; assert json.load(sys.stdin) == {"message": "Hello! This is a sample CI/CD application"}'

    - name: Show container logs on failure
      if: failure()
      run: docker logs app
